# Astro: kitty set up for agent CLIs (Claude Code, Codex, Hermes).
# SPDX-License-Identifier: GPL-3.0-or-later
# https://github.com/itmitalles-de/astro

# Automatic tiling for everyday use. The first layout is the default.
# Splits redistribute space along the split axis when panes are added or removed.
enabled_layouts splits:split_axis=auto;proportional=yes;equalize_on_window_close=yes,grid,tall,stack

# Open the requested 5x3 workspace on each normal application launch.
startup_session sessions/default.conf

# Match Tilix's login shell, including the user's profile and aliases.
shell /bin/bash --login

# Keep CLI colors when launching kitty from a process with NO_COLOR set.
env NO_COLOR

# GNOME provides its GTK window frame to Xwayland applications.
linux_display_server x11
hide_window_decorations no

# Match the existing Tilix font and Gruvbox palette.
font_family Ubuntu Sans Mono
font_size 11.0
# One regular outline family for all pane buttons, generated by build_pane_icons.py.
symbol_map U+E900-U+E90E Astro Pane Controls
narrow_symbols U+E900-U+E90E 2
background #191919
foreground #ebdbb2
cursor #ebdbb2
selection_background #504945
selection_foreground #ebdbb2
color0 #323232
color1 #cc241d
color2 #98971a
color3 #d79921
color4 #458588
color5 #b16286
color6 #689d6a
color7 #a89984
color8 #928374
color9 #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2

# Keep individual terminals identifiable in large layouts.
window_border_width 1.0
window_padding_width 2
active_border_color #8ec07c
inactive_border_color #504945
window_title_bar top
window_title_bar_min_windows 1
window_title_bar_align left
window_title_template "{custom}"
watcher window_title_bar.py
window_title_bar_active_background #504945
window_title_bar_active_foreground #8ec07c
window_title_bar_inactive_background #3c3836
window_title_bar_inactive_foreground #a89984
# Rounded tabs like the agent TUIs; the bar only appears with a second tab.
tab_bar_edge top
tab_bar_min_tabs 2
tab_bar_style powerline
tab_powerline_style round
tab_bar_margin_height 2 0
tab_bar_background #191919
tab_title_template "{bell_symbol}{activity_symbol}{index} {title}{fmt.fg._928374}{' · ' + str(num_windows) if num_windows > 1 else ''}"
active_tab_title_template "{index} {title}{' · ' + str(num_windows) if num_windows > 1 else ''}"
active_tab_background #8ec07c
active_tab_foreground #191919
active_tab_font_style bold
inactive_tab_background #3c3836
inactive_tab_foreground #a89984
inactive_tab_font_style normal
bell_on_tab "● "
tab_activity_symbol "• "

# Agents ring the bell when they finish or wait for input: mark the pane
# title (window_title_bar.py), flash nothing, and raise the OS window hint.
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell yes

# Focus: the active pane keeps full contrast, the others recede slightly.
inactive_text_alpha 0.82

# Cursor: a thin beam with a short trail for big jumps between panes.
cursor_shape beam
cursor_beam_thickness 1.6
cursor_trail 3
cursor_trail_decay 0.08 0.3

# Links: plain until hovered, show the target of OSC 8 links on hover.
url_style curly
underline_hyperlinks hover
show_hyperlink_targets yes

# Desktop notification when a long shell command finishes in a pane you are
# not looking at (needs shell integration; agent panes notify themselves).
notify_on_cmd_finish unfocused 20.0 notify

# Copying from agent TUIs: drop the padding spaces at line ends.
strip_trailing_spaces smart

scrollback_lines 20000

# Copy mouse selections immediately; keep Ctrl+C available to terminal apps.
copy_on_select clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Add a terminal in the current directory; the active layout makes room for it.
map ctrl+shift+enter launch --cwd=current
map ctrl+alt+a launch --cwd=current
map ctrl+shift+t new_tab_with_cwd

# Familiar Tilix split keys, with proportional sizing in the splits layout.
map ctrl+alt+r combine : goto_layout splits : launch --location=vsplit --cwd=current
map ctrl+alt+d combine : goto_layout splits : launch --location=hsplit --cwd=current

# Grid, layout cycling, temporary zoom, and equal sizing.
map ctrl+alt+g goto_layout grid
map ctrl+shift+l next_layout
map ctrl+shift+z toggle_layout stack
map ctrl+home combine : resize_window reset : layout_action equalize
map f11 toggle_fullscreen

# Navigate by direction, or label every visible terminal for quick selection.
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down
map ctrl+shift+space focus_visible_window
map alt+1 first_window
map alt+2 second_window
map alt+3 third_window
map alt+4 fourth_window
map alt+5 fifth_window
map alt+6 sixth_window
map alt+7 seventh_window
map alt+8 eighth_window
map alt+9 ninth_window
