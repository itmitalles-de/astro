# Astro agent workspace: three equal columns with Claude Code on top,
# Hermes in the middle and Codex below, plus a narrow monitor column on the
# right with htop and a shell. Replace any agent command with `agy` to run
# Antigravity CLI panes (their `/rename` session titles appear automatically).
# Each command drops back to a login shell when it exits, so a missing CLI
# leaves a normal shell in its pane.
layout splits:split_axis=auto;proportional=yes;equalize_on_window_close=yes
cd ~

# Split off the narrow monitor column first, then three equal agent columns.
launch --var cell=c1 bash --login -ic 'claude; exec bash --login'
launch --location=vsplit --bias=15 --var cell=mon bash --login -ic 'htop; exec bash --login'
focus_matching_window var:cell=c1
launch --location=vsplit --bias=66.667 --var cell=c2 bash --login -ic 'claude; exec bash --login'
launch --location=vsplit --bias=50 --var cell=c3 bash --login -ic 'claude; exec bash --login'

focus_matching_window var:cell=c1
launch --location=hsplit bash --login -ic 'hermes; exec bash --login'
launch --location=hsplit bash --login -ic 'codex; exec bash --login'
focus_matching_window var:cell=c2
launch --location=hsplit bash --login -ic 'hermes; exec bash --login'
launch --location=hsplit bash --login -ic 'codex; exec bash --login'
focus_matching_window var:cell=c3
launch --location=hsplit bash --login -ic 'hermes; exec bash --login'
launch --location=hsplit bash --login -ic 'codex; exec bash --login'
focus_matching_window var:cell=mon
launch --location=hsplit

focus_matching_window var:cell=c1
